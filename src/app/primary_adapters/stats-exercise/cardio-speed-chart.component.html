@if (chartData(); as cd) {
	<div>
		<svg viewBox="0 0 320 150" width="100%" class="chart-svg">
			<defs>
				<linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
					<stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
					<stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
				</linearGradient>
			</defs>

			<!-- Grid lines -->
			<line x1="0" y1="110" x2="320" y2="110" stroke="#2a2a38" stroke-width="1" />
			<line x1="0" y1="80" x2="320" y2="80" stroke="#2a2a38" stroke-width="0.5" stroke-dasharray="4 4" />
			<line x1="0" y1="50" x2="320" y2="50" stroke="#2a2a38" stroke-width="0.5" stroke-dasharray="4 4" />
			<line x1="0" y1="20" x2="320" y2="20" stroke="#2a2a38" stroke-width="0.5" stroke-dasharray="4 4" />

			<!-- Regression line (behind curve) -->
			@if (regressionOverlay().visible) {
				<line
					class="regression-line"
					[attr.x1]="regressionOverlay().x1"
					[attr.y1]="regressionOverlay().y1"
					[attr.x2]="regressionOverlay().x2"
					[attr.y2]="regressionOverlay().y2"
					stroke="#7b4f06"
					stroke-width="1.5"
					stroke-dasharray="4 2"
				/>
			}

			<!-- Area fill -->
			@if (cd.speedPolyline) {
				<path [attr.d]="cd.speedAreaPoints" fill="url(#amberGrad)" />
			}

			<!-- Line -->
			@if (cd.speedPolyline) {
				<path
					[attr.d]="cd.speedPolyline"
					fill="none"
					stroke="#f59e0b"
					stroke-width="2.5"
					stroke-linejoin="round"
					stroke-linecap="round"
				/>
			}

			<!-- Dots + value labels -->
			@for (p of cd.speedPoints; track $index) {
				<circle [attr.cx]="p.x" [attr.cy]="p.y" r="3" fill="#f59e0b" />
				@if (p.label) {
					<text
						[attr.x]="p.x"
						[attr.y]="p.y - 7"
						text-anchor="middle"
						font-family="IBM Plex Mono"
						font-size="7.5"
						font-weight="600"
						fill="#f59e0b"
					>
						{{ p.label }}
					</text>
				}
			}

			<!-- X axis labels -->
			@for (l of cd.xLabels; track $index) {
				@if (l.label) {
					<text [attr.x]="l.x" y="126" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="#6b6b80">
						{{ l.label }}
					</text>
				}
			}

			<!-- Regression label (on top, shifted right) -->
			@if (regressionOverlay().visible) {
				<text
					class="regression-label"
					[attr.x]="regressionOverlay().labelX"
					[attr.y]="regressionOverlay().labelY"
					font-size="8"
					fill="#7b4f06"
				>{{ regressionOverlay().labelText }}</text>
			}
		</svg>
	</div>
} @else {
	<div class="empty-chart">{{ "common.noData" | translate }}</div>
}
