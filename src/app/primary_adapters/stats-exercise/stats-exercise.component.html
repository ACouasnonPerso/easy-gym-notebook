
    <div class="page">
      <div class="back-btn" (click)="goBack()"><span class="back-arrow">←</span> {{ 'common.back' | translate }}</div>
      <div class="page-title">{{ exerciseName }}</div>

      <app-stats-exercise-chart-card
        [isCardio]="useCase.isCardio()"
        [occurrences]="useCase.occurrences()"
        [cardioOccurrences]="useCase.cardioOccurrences()"
        [selectedChart]="chartSelection.selectedChart()"
        (chartSelect)="chartSelection.select($event)"
      />

      <app-exercise-history-list
        [isCardio]="useCase.isCardio()"
        [occurrences]="useCase.occurrences()"
        [cardioOccurrences]="useCase.cardioOccurrences()"
      />
    </div>
