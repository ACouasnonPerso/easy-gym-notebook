<div class="page">
	<!-- Top bar: version + month selector -->
	<app-stats-duration-selector
		[durations]="durations()"
		[selectedMonthIndex]="selectedMonthIndex()"
		(monthChange)="onMonthChange($event)"
	/>

	<!-- Highlights (dynamic positive metrics) -->
	<app-stats-highlights-card [highlights]="getGlobalStatsUseCase.highlights()" />

	<!-- Heatmap -->
	@if (showHeatmap()) {
		<app-stats-heatmap-card [data]="getGlobalStatsUseCase.heatmapData()" />
	}

	<!-- Yearly heatmap (année en cours) -->
	@if (showYearlyHeatmap()) {
		<app-stats-yearly-heatmap-card [data]="getGlobalStatsUseCase.yearlyHeatmapData()" />
	}

	<!-- Worked muscles -->
	<app-stats-muscle-donut-card
		[distribution]="getGlobalStatsUseCase.muscleGroupDistribution()"
		[details]="getGlobalStatsUseCase.muscleGroupDetails()"
	/>

	<!-- Week summary -->
	@if (isCurrentMonth() && !weekSameAsMonth()) {
		<app-stats-summary-card
			[title]="'statsGlobal.weekSummary' | translate"
			[summary]="getGlobalStatsUseCase.weekSummary()"
		/>
	}

	<!-- Summary (title adapts to selected view: month / year / total / week) -->
	<app-stats-summary-card
		[title]="summaryTitle() | translate"
		[summary]="
			selectedViewType() === 'current-week' ? getGlobalStatsUseCase.weekSummary() : getGlobalStatsUseCase.monthSummary()
		"
	/>

	<!-- Training time bar chart -->
	@if (selectedViewType() !== "current-week" && getGlobalStatsUseCase.sessionDurationsInMonth().length > 0) {
		<app-stats-training-time-card
			[sessions]="getGlobalStatsUseCase.sessionDurationsInMonth()"
			[mode]="barChartMode()"
		/>
	}

	<!-- Exercise list -->
	@if (getGlobalStatsUseCase.exerciseSummaries().length > 0) {
		<app-stats-exercise-list-card
			[exercises]="getGlobalStatsUseCase.exerciseSummaries()"
			(exerciseSelected)="navigateToExerciseStats($event)"
			(mergeSubmit)="onMergeSubmit($event)"
		/>
	}

	<!-- Import / Export card -->
	<app-stats-import-export-card (importConfirmed)="onDataImported()" />
</div>
