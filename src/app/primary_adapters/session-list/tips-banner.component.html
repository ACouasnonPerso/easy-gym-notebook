@if (showOnboarding()) {
  <div class="tips-banner">
    <span class="tips-icon">💡</span>
    <span class="tips-text">{{ 'sessionList.tip' | translate }}</span>
  </div>
}

@if (showReview()) {
  <button class="tips-banner tips-banner--clickable" (click)="onReviewClick()">
    <span class="tips-icon">⭐</span>
    <span class="tips-text">{{ 'sessionList.reviewTip' | translate }}</span>
  </button>
}

@if (showThanks()) {
  <div class="tips-banner">
    <span class="tips-icon">🙏</span>
    <span class="tips-text">{{ 'sessionList.reviewThanks' | translate }}</span>
  </div>
}
