<div class="overlay" (click)="cancelled.emit()">
	<div class="form-card" (click)="$event.stopPropagation()">
		<h2 class="form-title">{{ "rating.title" | translate }}</h2>
		<div class="rating-list">
			@for (option of options; track option.value) {
				<button
					type="button"
					class="rating-option"
					[class.rating-option--active]="currentRating() === option.value"
					(click)="selectRating(option.value)"
					[attr.aria-label]="displayValue(option) + '/20 - ' + (option.label | translate)"
				>
					<span class="rating-value">{{ displayValue(option) }}</span>
					<span class="rating-label">{{ option.label | translate }}</span>
				</button>
			}
		</div>
	</div>
</div>
