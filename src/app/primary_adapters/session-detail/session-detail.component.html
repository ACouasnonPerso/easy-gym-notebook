<div class="page">
  @if (session()) {
    <app-session-header
      [session]="session()!"
      [durationLabel]="durationLabel()"
      [chronoStatus]="chronoStatus()"
      [totalWeightFormatted]="totalWeightFormatted()"
      (goBack)="goBack()"
      (dateChange)="onDateChange($event)"
      (durationClick)="onDurationClick()"
      (endSession)="onEndSession()"
      (pause)="onPause()"
      (resume)="onResume()"
    />
  }

  <app-session-exercises-list
    [exercises]="exercises()"
    [sessionId]="sessionId()"
    (exerciseValidate)="onExerciseValidate($event)"
    (exerciseCancel)="onExerciseCancel($event)"
    (exerciseUpdate)="onExerciseUpdate($event.exercise, $event.changes)"
    (exerciseDelete)="onExerciseDelete($event)"
    (openChrono)="navigateToExerciseChrono($event)"
    (openStats)="navigateToStats($event)"
  />

  @if (endSessionUseCase.showManualOverride()) {
    <div class="overlay" (click)="endSessionUseCase.showManualOverride.set(false)">
      <div class="manual-duration-card" (click)="$event.stopPropagation()">
        <p class="manual-duration-label">Durée de séance (secondes)</p>
        <input
          type="number"
          class="manual-duration-input"
          [value]="manualDurationSeconds()"
          (input)="manualDurationSeconds.set(+$any($event.target).value)"
          min="0"
        />
        <div class="manual-duration-actions">
          <button class="btn-cancel" (click)="endSessionUseCase.showManualOverride.set(false)">Annuler</button>
          <button class="btn-primary" (click)="endSessionUseCase.executeWithManualDuration(manualDurationSeconds())">Terminer</button>
        </div>
      </div>
    </div>
  }

  @if (showDurationPicker()) {
    <app-edit-duration-popup
      [initialSeconds]="session()?.status === 'active' ? currentElapsedSeconds() : (session()?.durationSeconds ?? 0)"
      (confirmed)="onDurationConfirmed($event)"
      (cancelled)="showDurationPicker.set(false)"
    />
  }
</div>
