<div class="session-meta">
	<span class="session-date-label" (click)="toggleDateInput()">{{ dateLabel() }}</span>
	@if (showDateInput()) {
		<input
			type="date"
			class="date-input"
			[value]="currentDateStr()"
			(change)="onDateChange($any($event.target).value)"
			(keydown.escape)="showDateInput.set(false)"
		/>
	}
	<div class="session-quick-stats">
		<div class="quick-stat">
			<span class="quick-stat-value">{{ totalWeightFormatted() }}</span>
			<span class="quick-stat-label">{{ "common.weight" | translate }}</span>
		</div>
	</div>
</div>
