<div class="header-pad">
	<div style="margin-top: 9px">
		<app-chrono-back-button (back)="back.emit()" />
	</div>
	<div class="right-actions">
		<div class="top-actions">
			<button
				class="settings-gear-btn"
				data-testid="settings-gear-btn"
				(click)="openSettings.emit()"
				aria-label="Settings"
			>
				CUSTOM
			</button>
			<app-chrono-sound-button [soundEnabled]="soundEnabled()" (toggleSound)="toggleSound.emit()" />
		</div>
		<app-chrono-series-badge
			[hasExercise]="hasExercise()"
			[seriesCount]="seriesCount()"
			(incrementSeries)="incrementSeries.emit()"
			(decrementSeries)="decrementSeries.emit()"
		/>
	</div>
</div>
