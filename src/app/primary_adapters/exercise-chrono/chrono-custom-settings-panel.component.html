<div class="overlay" (click)="cancel()">
  <div class="sheet" (click)="$event.stopPropagation()">
    <h2 class="sheet-title">{{ "chrono.customSettings" | translate }}</h2>

    <div class="pickers-row">
      <div class="picker-col">
        <span class="picker-label">{{ "chrono.exerciseDuration" | translate }}</span>
        <app-drum-picker
          [values]="durationValues"
          [selectedValue]="exerciseDuration()"
          (valueChange)="exerciseDuration.set($event)"
        />
      </div>

      <div class="picker-col">
        <span class="picker-label">{{ "chrono.breakDuration" | translate }}</span>
        <app-drum-picker
          [values]="durationValues"
          [selectedValue]="breakDuration()"
          (valueChange)="breakDuration.set($event)"
        />
      </div>

      <div class="picker-col">
        <span class="picker-label">{{ "chrono.repetitions" | translate }}</span>
        <app-drum-picker
          [values]="repValues"
          [selectedValue]="repetitions()"
          (valueChange)="repetitions.set($event)"
        />
      </div>
    </div>

    <div class="actions">
      <button class="btn-cancel" data-testid="cancel-btn" (click)="cancel()">{{ "common.cancel" | translate }}</button>
      <button class="btn-primary" data-testid="confirm-btn" (click)="confirm()">{{ "common.confirm" | translate }}</button>
    </div>
  </div>
</div>
