<div class="page" [class.blinking]="isBlinking()">
  <app-chrono-header
    [hasExercise]="hasExercise()"
    [soundEnabled]="soundEnabled()"
    [seriesCount]="seriesCount()"
    [formattedBreakDuration]="formattedBreakDuration()"
    (back)="location.back()"
    (toggleSound)="exerciseChronoUseCase.toggleSound()"
    (openBreakDurationPopup)="showBreakDurationPopup.set(true)"
    (incrementSeries)="haptic.vibrate(); exerciseChronoUseCase.incrementSeriesCount()"
    (decrementSeries)="haptic.vibrate(); exerciseChronoUseCase.decrementSeriesCount()"
  />

  <div class="chrono-body">
    <app-chrono-ring
      [formattedTime]="formattedTime()"
      [statusLabel]="statusLabel()"
      [ringColor]="ringColor()"
      [ringOffset]="ringOffset()"
    />

    <app-chrono-actions
      [chronoState]="chronoState()"
      (start)="haptic.vibrate(); exerciseChronoUseCase.start()"
      (pause)="haptic.vibrate(); exerciseChronoUseCase.pause()"
      (resume)="haptic.vibrate(); exerciseChronoUseCase.resume()"
      (reset)="haptic.vibrate(); exerciseChronoUseCase.reset()"
      (goBreak)="haptic.vibrate(); exerciseChronoUseCase.goBreak()"
      (goTraining)="haptic.vibrate(); exerciseChronoUseCase.goTraining()"
      (addTime)="exerciseChronoUseCase.addTime($event)"
    />
  </div>
</div>

@if (showBreakDurationPopup()) {
  <app-edit-duration-popup
    [initialSeconds]="_breakDuration()"
    (confirmed)="onBreakDurationConfirmed($event)"
    (cancelled)="showBreakDurationPopup.set(false)"
  />
}
